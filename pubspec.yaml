name: arrava_mobile
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  google_fonts: ^6.2.1
  image_picker: ^1.2.4

dependency_overrides:
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/appIconARRAVA.png"
  min_sdk_android: 21
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/auth/
    - assets/badges/
    - assets/karakter/
    - assets/karakter/quiz/
    - assets/karakter/membacaDokumen/
    - assets/sounds/widgets/
    - assets/widget/
    - assets/widget/cards/
